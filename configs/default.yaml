data:
  data_root: data
  image_size: 224
  train_ratio: 0.7
  val_ratio: 0.15
  test_ratio: 0.15
  random_seed: 42

model:
  backbone: densenet121
  num_classes: 14
  pretrained: true
  dropout: 0.5

training:
  batch_size: 32
  num_epochs: 50
  learning_rate: 0.0001
  weight_decay: 0.00001
  use_amp: true
  early_stopping_patience: 7

inference:
  threshold: 0.5
  top_k: 3
